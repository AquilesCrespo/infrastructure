services:
  mysql:
    image: mysql:${MYSQL_TAG:-8.4}
    environment:
      MYSQL_ROOT_PASSWORD: test-only-root
      MYSQL_DATABASE: workflow_test
      MYSQL_USER: workflow_test
      MYSQL_PASSWORD: test-only-password
    volumes:
      - mysql_test:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql -uroot -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    environment:
      POSTGRES_USER: workflow_test
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: workflow_test
    volumes:
      - postgres_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "workflow_test", "-d", "workflow_test"]
      interval: 3s
      timeout: 5s
      retries: 60
  mongodb:
    image: mongo:${MONGO_TAG:-7.0}
    environment:
      MONGO_INITDB_ROOT_USERNAME: workflow_test
      MONGO_INITDB_ROOT_PASSWORD: test-only-password
    volumes:
      - mongodb_test:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "workflow_test", "--password", "test-only-password", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 5s
      retries: 60

volumes:
  mysql_test:
  postgres_test:
  mongodb_test:
